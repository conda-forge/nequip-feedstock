schema_version: 1

context:
  name: nequip
  version: "0.19.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/nequip-${{ version }}.tar.gz
  sha256: 0a6ccb5ec8b7691e6bc4ce74aa48ddffd70d5389f785a173929246d0ce64e0c2

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - nequip-train = nequip.scripts.train:main
      - nequip-evaluate = nequip.scripts.evaluate:main
      - nequip-benchmark = nequip.scripts.benchmark:main
      - nequip-deploy = nequip.scripts.deploy:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - requests
    - hydra-core
    - lightning >=2.6,!=2.6.2,!=2.6.3
    - lmdb
    - python-lmdb
    - matscipy
    - pytorch >=2.2.0
    - torchmetrics >=1.6.0
    - typing_extensions
    - python >=${{ python_min }}
    - numpy
    - ase
    - tqdm
    - e3nn >=0.6.0,<0.7.0
    - pyyaml
    - importlib-metadata
    - torch-runstats >=0.2.0
    - torch-ema >=0.3.0

tests:
  - python:
      imports:
        - nequip
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: NequIP is a code for building E(3)-equivariant interatomic potentials
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/mir-group/nequip
  repository: https://github.com/mir-group/nequip
  documentation: https://github.com/mir-group/nequip

extra:
  recipe-maintainers:
    - jan-janssen
