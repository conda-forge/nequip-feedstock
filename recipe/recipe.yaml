schema_version: 1

context:
  name: nequip
  version: 0.19.2

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/nequip-${{ version }}.tar.gz
  sha256: 4457b3ef1a1bf7565838fb4190dd9cfac53f7784f110c332a664dad9d5ebdfca

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - nequip-train = nequip.scripts.train:main
      - nequip-evaluate = nequip.scripts.evaluate:main
      - nequip-benchmark = nequip.scripts.benchmark:main
      - nequip-deploy = nequip.scripts.deploy:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - requests
    - hydra-core
    - lightning >=2.6,!=2.6.2,!=2.6.3
    - python-lmdb
    - matscipy >=1.3.0
    - pytorch >=2.3.0
    - torchmetrics >=1.6.0
    - python >=${{ python_min }}
    - numpy >=2.0.0
    - ase
    - tqdm
    - e3nn >=0.6.0,<0.7.0
    - pyyaml
    - importlib-metadata
tests:
  - python:
      imports:
        - nequip
      pip_check: true
      python_version:
        - ${{ python_min }}
        - '*'

about:
  summary: NequIP is a code for building E(3)-equivariant interatomic potentials
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/mir-group/nequip
  repository: https://github.com/mir-group/nequip
  documentation: https://github.com/mir-group/nequip

extra:
  recipe-maintainers:
    - jan-janssen
